name: Comprobar Wireless Cooking

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wc_test
          POSTGRES_PASSWORD: only-for-isolated-ci-tests
          POSTGRES_DB: wireless_cooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: wireless_cooking_test
      DB_USER: wc_test
      DB_PASSWORD: only-for-isolated-ci-tests
      DB_SSL: 'false'
      JWT_SECRET: isolated-ci-test-secret-with-more-than-32-characters
      NODE_ENV: test
      PAYMENT_MODE: demo
      IMAGE_STORAGE: local
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci --no-fund
      - run: npm --prefix frontend ci --no-fund
      - run: npm --prefix backend test
      - run: node --test frontend/tests/*.test.js
      - run: npm --prefix frontend run lint
      - run: node scripts/build-production.mjs
