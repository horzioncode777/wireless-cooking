<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=wireless-cooking" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/wireless-cooking-icon.png" sizes="64x64" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/logo.png" as="image" type="image/png" />
    <link rel="stylesheet" href="/src/styles/loading.css" />
    <title>Wireless Cooking · Tiendas de la Sabana</title>
  </head>
  <body>
    <div id="root">
      <section class="wc-loading" aria-label="Cargando Wireless Cooking">
        <div class="wc-loading__card">
          <div class="wc-loading__brand">
            <img src="/logo.png" alt="Wireless Cooking" width="467" height="211" fetchpriority="high" />
          </div>
          <p class="wc-loading__eyebrow">Hecho para conectar</p>
          <h1 class="wc-loading__title">El buen gusto empieza aquí.</h1>
          <p class="wc-loading__description">Cocina, artesanía y comercio local.</p>
          <div class="wc-loading__track" aria-hidden="true"><span></span></div>
          <p class="wc-loading__status" role="status">
            <span class="wc-loading__dot" aria-hidden="true"></span>
            Cargando tu experiencia…
          </p>
        </div>
      </section>
    </div>
    <noscript>
      <style>.wc-loading { display: none; }</style>
      <p>Activa JavaScript en tu navegador para usar Wireless Cooking.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
